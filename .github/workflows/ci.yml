name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Configure Turnlock deploy key
        shell: bash
        env:
          TURNLOCK_DEPLOY_KEY: ${{ secrets.TURNLOCK_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 0700 "$HOME/.ssh"
          printf '%s' "$TURNLOCK_DEPLOY_KEY" > "$HOME/.ssh/turnlock_ci"
          chmod 0600 "$HOME/.ssh/turnlock_ci"
          ssh-keyscan -t ed25519 github.com > "$HOME/.ssh/known_hosts"
          chmod 0644 "$HOME/.ssh/known_hosts"
          git config --global core.sshCommand "ssh -i $HOME/.ssh/turnlock_ci -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"

      - name: Turnlock SSH access smoke
        shell: bash
        run: |
          set -euo pipefail
          expected='a519ee6a31fb243921d0b2f6c2379d8f0c919801'
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          git -C "$smoke_dir" init --quiet
          git -C "$smoke_dir" fetch --no-tags --depth=1 git@github.com:fanilosendrison/turnlock.git "$expected"
          actual="$(git -C "$smoke_dir" rev-parse FETCH_HEAD)"
          test "$actual" = "$expected"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check packages
        run: pnpm run typecheck:packages

      - name: Type-check application
        run: pnpm run typecheck

      - name: Type-check compiled runtime
        run: pnpm run typecheck:node

      - name: Type-check telemetry smoke test
        run: pnpm run typecheck:node:stats

      - name: Lint
        run: pnpm run lint

      - name: Test source and packages
        run: pnpm test

      - name: Verify package artifacts
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/package-artifacts"
          mkdir -p "$package_dir"
          pnpm --filter @git-commits-push/node-runtime pack --pack-destination "$package_dir"
          pnpm --filter @git-commits-push/trust pack --pack-destination "$package_dir"
          node_runtime_version="$(node -p "require('./packages/node-runtime/package.json').version")"
          trust_version="$(node -p "require('./packages/trust/package.json').version")"
          tar -tzf "$package_dir/git-commits-push-node-runtime-$node_runtime_version.tgz" > "$package_dir/node-runtime.contents"
          tar -tzf "$package_dir/git-commits-push-trust-$trust_version.tgz" > "$package_dir/trust.contents"
          grep -Fxq package/dist/process-contract.js "$package_dir/node-runtime.contents"
          grep -Fxq package/dist/index.js "$package_dir/trust.contents"

      - name: Test compiled runtime
        run: pnpm run test:node:build

      - name: Test telemetry integration
        run: pnpm run test:node:stats
